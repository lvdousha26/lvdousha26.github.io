name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每日 00:37 UTC (= 08:37 北京时间) 重建一次。
  # 页面上有些数据是构建时抓的 —— 首页的 GitHub 贡献热力图会在 build 阶段
  # 请求 github-contributions-api.jogruber.de, 静态页面部署后就固定了,
  # 不重建就永远停在上次 push 时的快照。
  # 分钟数取 37 而非 0: GitHub 官方文档说明整点前后是调度高峰, 定时任务
  # 容易被推迟甚至丢, 错开整点可显著降低延迟。
  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
